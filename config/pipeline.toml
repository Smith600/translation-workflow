# 各角色使用哪个 agent / 模型。想换模型只改这里。
# agent = "devin" 时：model 为 `devin models` 列出的确切型号
# agent = "pi"    时：provider + model 为 `pi --list-models` 列出的名称
#
# 原则：评审不能与译者、裁决者、润色者同一家族（否则会偏袒自己）。
# 当前分配：Anthropic 译者甲 / Kimi(SWE-2) 译者乙 / OpenAI 裁决 / DeepSeek 润色 / Google + Qwen 评审

[roles.translator_a]
agent = "devin"
model = "claude-opus-5-5-medium"

[roles.translator_b]
agent = "devin"
model = "swe-2-high"

[roles.preparer]
agent = "devin"
model = "swe-2-high"

[roles.adjudicator]
agent = "devin"
model = "gpt-5-5-medium"

[roles.polisher]
agent = "pi"
provider = "aliyun-token-plan"
model = "deepseek-v4.1-flash"

[roles.judge_1]
agent = "devin"
model = "gemini-4-carbon-low"   # medium 档每次约 6 分钟，low 档约 15 秒

[roles.judge_2]
agent = "pi"
provider = "aliyun-token-plan"
model = "qwen3.8-max"

[roles.backtranslator]
agent = "pi"
provider = "aliyun-token-plan"
model = "qwen3.8-flash"

[roles.qa_writer]
agent = "pi"
provider = "aliyun-token-plan"
model = "qwen3.8-max"

[roles.qa_answerer]
agent = "pi"
provider = "aliyun-token-plan"
model = "qwen3.8-flash"

[roles.seeder]
agent = "devin"
model = "swe-2-medium"

[eval]
judges = ["judge_1", "judge_2"]
qa_questions = 12
seed_errors = 8

[eval.weights]
minor = 1
major = 5
critical = 25

[agents]
timeout_seconds = 900
attempts = 2
